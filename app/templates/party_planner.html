{% extends "base.html" %}
{% block title %}Party Planner{% endblock %}
{% block content %}<section class="page"><div class="form-card wide">
<h1>🎉 Party Budget Planner</h1><p>Plan food, venue, decoration and entertainment.</p>
<form id="partyForm">
<label>Budget (₹)<input name="budget" type="number" min="1" required></label>
<label>Guests<input name="guests" type="number" min="1" required></label>
<label>Event Type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Anniversary</option><option>Other</option></select></label>
<label>Venue preference<input name="venue" placeholder="Banquet hall, home, outdoor..."></label>
<label>City<input name="city" placeholder="Chennai"></label>
<label>Preferences<textarea name="preferences" placeholder="Vegetarian food, music, theme..."></textarea></label>
<button class="btn primary">Generate Recommendations</button></form><div id="result"></div>
</div></section>{% endblock %}
{% block scripts %}<script>initPartyPlanner();</script>{% endblock %}
